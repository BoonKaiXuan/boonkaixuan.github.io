<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form-element</title>
    <link rel="stylesheet" a href="../css/common/variables.css">
    <link rel="stylesheet" a href="../css/common/form-element.css">
    <link rel="stylesheet" a href="../css/common/typography.css">
    <link rel="stylesheet" a href="../css/common/layout.css">
    <link rel="stylesheet" a href="../css/common/button.css">
</head>

<body>
    <div id="main">
        <section>
            <label for="fname">Your name</label><br>
            <input class="form text-field_no-borderline col-1" type="text" id="fname" name="fname"><br>
            <label for="email">Your email</label><br>
            <input class="form text-field_no-borderline col-1" type="text" id="email" name="email"><br>
            <label for="subject">Subject</label><br>
            <input class=" form text-field_no-borderline col-1" type="text" id="subject" name="subject"><br>
            <label for="message">Message</label><br>
            <textarea class=" form text-field_no-borderline col-1 textarea" type="text" id="message"
                name="message"></textarea>
        </section>

        <section>
            <div class="direction-col">
                <input class="form text-field_with-borderline" type="text" placeholder="Malaysia">
                <input class=" form text-field_with-borderline" type="text" placeholder="Address">
                <select class="form text-field_with-borderline" name="state" id="state">
                    <option value="" disabled selected>State</option>
                    <option value="Johor">Johor</option>
                    <option value="Kedah">Kedah</option>
                    <option value="Melaka">Melaka</option>
                    <option value="Kelantan">Kelantan</option>
                    <option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Perak">Perak</option>
                    <option value="Perlis">Perlis</option>
                    <option value="Pulau Pinang">Pulau Pinang</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Terengganu">Terengganu</option>
                    <option value="Sabah">Sabah</option>
                    <option value="Sarawak">Sarawak</option>
                </select>
            </div>
            <div class="row-flex gap-20">
                <input class="form col-2 text-field_with-borderline" type="text" placeholder="Postcode">
                <input class="form col-2 text-field_with-borderline" type="text" placeholder="City">
            </div>
        </section>

        <section>
            <textarea class="form text-field_no-borderline col-1 textarea" type="text"
                placeholder="Comment..."></textarea>
            <div class="row-flex gap-20">
                <input class="col-3 form text-field_no-borderline" type="text" placeholder="Name (required)">
                <input class="col-3 form text-field_no-borderline" type="text" placeholder="Email (required)">
                <input class="col-3 form text-field_no-borderline" type="text" placeholder="Website">
                <input type="checkbox" id="save" name="save" value="save">
                <label for="save"> Save my name, email, and website in this browser for the next time I comment.</label>
            </div>
            <div><button class="btn"><a href="https://google.com">Post comment</a></button></div>
        </section>
    </div>


</body>

</html>
